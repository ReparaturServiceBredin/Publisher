name: Windows-EXE bauen

# Jeder Push baut eine neue Publisher.exe und veröffentlicht sie als GitHub-Release.
# Die installierte .exe prüft beim Start das neueste Release und aktualisiert sich selbst.
on:
  push:
    branches: [main, master, "claude/**"]
    paths-ignore: ["twitch_giveaway_bot/**"]  # der Bot ist kein Teil der Publisher.exe
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -e ".[dev,all]"
      - run: pytest -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versionsnummer setzen
        shell: bash
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          printf '"""Wird beim Bauen der .exe automatisch überschrieben."""\n\n__version__ = "%s"\n' "$VERSION" > publisher/_version.py

      - name: Abhängigkeiten
        run: pip install ".[exe,youtube]"

      - name: EXE bauen
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name Publisher
          --collect-data imageio_ffmpeg
          --collect-data tzdata
          --collect-data customtkinter
          --collect-all tkinterdnd2
          --hidden-import publisher.gui_refs
          --hidden-import publisher.learn
          --collect-submodules yt_dlp
          --hidden-import publisher.gui
          --hidden-import publisher.tiktok
          --hidden-import publisher.videobox
          --hidden-import publisher.youtube
          --hidden-import googleapiclient.discovery
          --exclude-module anthropic
          publisher_app.py

      - name: Selbsttest der fertigen EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Publisher.exe -ArgumentList '--selftest','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Update-Neustart echt testen (Tausch + Neustart auf Windows)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "upd"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item dist\Publisher.exe (Join-Path $d "Publisher.exe")
          $res = Join-Path $d "result.txt"
          $p = Start-Process -FilePath (Join-Path $d "Publisher.exe") -ArgumentList '--update-selftest', $res -PassThru
          $p.WaitForExit()
          for ($i = 0; $i -lt 60 -and -not (Test-Path $res); $i++) { Start-Sleep -Seconds 1 }
          Get-ChildItem $d | Format-Table Name, Length
          if (Test-Path (Join-Path $d "result.how")) { "Neustart-Weg: " + (Get-Content (Join-Path $d "result.how")) }
          if (-not (Test-Path $res)) { Write-Error "Die neue exe wurde nach dem Update NICHT gestartet"; exit 1 }
          Get-Content $res

      - uses: actions/upload-artifact@v4
        with:
          name: Publisher-${{ env.VERSION }}
          path: dist/Publisher.exe

      - name: Release veröffentlichen (Quelle für Auto-Update)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/Publisher.exe \
            --title "Publisher $VERSION" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Herunterladen: Publisher.exe" \
            --target "$GITHUB_SHA" --latest
