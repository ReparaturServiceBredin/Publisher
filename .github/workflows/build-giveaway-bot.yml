name: GiveawayBot.exe bauen

# Baut den Twitch-Giveaway-Bot als Windows-.exe und legt sie im Release „giveaway-bot“ ab
# (feste Download-Adresse). Das Release wird bewusst NICHT als „latest“ markiert,
# damit das Auto-Update der Publisher.exe davon unberührt bleibt.
on:
  push:
    branches: [main, master, "claude/**"]
    paths: ["twitch_giveaway_bot/**", ".github/workflows/build-giveaway-bot.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-giveaway-bot
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: twitch_giveaway_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install websockets pyinstaller

      - name: Twitch-App-ID eintragen (falls als Repository-Variable TWITCH_CLIENT_ID gesetzt)
        if: ${{ vars.TWITCH_CLIENT_ID != '' }}
        shell: bash
        run: printf 'CLIENT_ID = "%s"\n' "${{ vars.TWITCH_CLIENT_ID }}" > bot_identity.py

      - name: Versionsnummer setzen
        shell: bash
        run: |
          VERSION="1.1.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          printf 'VERSION = "%s"\n' "$VERSION" > bot_version.py
          printf '%s' "$VERSION" > version.txt

      - name: Skript prüfen
        run: |
          python -m py_compile giveaway_bot.py giveaway_app.py bot_identity.py bot_version.py
          python giveaway_bot.py --selftest

      - name: EXE bauen (Fenster-Version)
        run: pyinstaller --noconfirm --clean --onefile --windowed --name GiveawayBot --collect-submodules websockets --hidden-import bot_identity --hidden-import bot_version giveaway_app.py

      - name: Selbsttest der fertigen EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\GiveawayBot.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Update-Neustart echt testen (Tausch + Neustart auf Windows)
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "upd"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item dist\GiveawayBot.exe (Join-Path $d "GiveawayBot.exe")
          $res = Join-Path $d "result.txt"
          $p = Start-Process -FilePath (Join-Path $d "GiveawayBot.exe") -ArgumentList '--update-selftest', $res -PassThru
          $p.WaitForExit()
          for ($i = 0; $i -lt 60 -and -not (Test-Path $res); $i++) { Start-Sleep -Seconds 1 }
          Get-ChildItem $d | Format-Table Name, Length
          if (Test-Path (Join-Path $d "result.how")) { "Neustart-Weg: " + (Get-Content (Join-Path $d "result.how")) }
          if (-not (Test-Path $res)) { Write-Error "Die neue exe wurde nach dem Update NICHT gestartet"; exit 1 }
          Get-Content $res

      - uses: actions/upload-artifact@v4
        with:
          name: GiveawayBot-${{ env.VERSION }}
          path: twitch_giveaway_bot/dist/GiveawayBot.exe

      - name: Release „giveaway-bot“ aktualisieren
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Twitch-Giveaway-Bot für Windows, Version $VERSION: GiveawayBot.exe herunterladen, starten, „Mit Twitch anmelden“, Kanäle eintragen, Start. Die exe aktualisiert sich danach selbst. Gebaut aus ${GITHUB_SHA::7}."
          if gh release view giveaway-bot >/dev/null 2>&1; then
            gh release upload giveaway-bot dist/GiveawayBot.exe --clobber
            gh release upload giveaway-bot version.txt --clobber   # erst nach der exe – sonst lädt ein Client die alte
            for old in GiveawayBot.zip config.example.json ANLEITUNG.md; do gh release delete-asset giveaway-bot "$old" -y || true; done
            gh release edit giveaway-bot --notes "$NOTES" --latest=false
          else
            gh release create giveaway-bot dist/GiveawayBot.exe version.txt \
              --title "Twitch-Giveaway-Bot (Windows)" --notes "$NOTES" --target "$GITHUB_SHA" --latest=false
          fi
